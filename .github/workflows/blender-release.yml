# A release of the Blender extension: blender-v<version>, the version in blender/package.json. Merging a pull request
# that changes that version releases it, and a tag pushed by hand still does.
#
# 0. The gate, a job that is cheap and runs first, works out the tag and the version. On a tag, the tag has to be
#    blender-v<the version in blender/package.json>. On a push to main that changes blender/package.json, the tag is
#    blender-v<its version>: where that tag is there already (the edit left the version as it was, or the version was
#    tagged by hand), the run ends there and releases nothing; otherwise the gate puts the tag on the pushed commit and
#    pushes it with the job's GITHUB_TOKEN. GitHub starts no workflow run for what GITHUB_TOKEN pushes (only
#    workflow_dispatch, repository_dispatch and some pull_request events are exceptions:
#    https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow#triggering-a-workflow-from-a-workflow),
#    so that tag does not start this workflow a second time. One release of the extension runs at a time (the
#    concurrency group), so a merge and a hand-pushed tag of one version cannot both release it: the merge's run finds
#    the tag and stops, and a tag pushed by hand after the gate pushed it is refused, or has nothing to push.
#    If a tag ruleset limits who may create *-v* tags, github-actions[bot] (the GitHub Actions app) has to be on its
#    bypass list, or the gate's push is refused. If the release job fails after the gate pushed the tag, "Re-run
#    failed jobs" runs it again for that tag; re-running all jobs runs the gate again, which finds the tag and stops.
# 1. The image is built from blender/server/Dockerfile (amd64), tagged with the version.
# 2. Its smoke test (scripts/smoke-blender.sh): it answers MCP with the tools blender/server/tools.json has, and refuses
#    requests without its token. Then its live view's (scripts/viewport-blender.py): the view follows what the agent's
#    code does to the scene, whatever that takes away.
# 3. It is pushed to GHCR, as a package of the prometheion organization, linked to this repository by its
#    org.opencontainers.image.source label. A new package starts private: an owner of the organization switches it to
#    public once, in the package's settings on GitHub (GitHub does not let it go back), or no portal can pull it.
# 4. The GitHub release is made with what the GPL asks to go with the image: Blender's source, checked against
#    blender.org's published sum; the sources of the copyleft libraries the official Linux build links in (FFmpeg,
#    built with x264 and x265, and the others under the GPL, the LGPL or the MPL: scripts/blender-sources.sh), each
#    checked against the hash Blender's source pins; and the list of the image's Ubuntu packages (their sources are in
#    Ubuntu's archive). Where the release is there already, as on a re-run after npm failed, it is left as it is, but
#    its assets are uploaded again (--clobber), so that it never lacks them; then the run goes on to npm.
# 5. The package, @pithagoras/blender, goes to npm last, so that a version on npm never names an image that is not
#    there. npm's trusted publishing signs in with this workflow's identity (`id-token: write`), with no token, and adds
#    provenance. Only a package that is there can be given a trusted publisher, so its first version is published by
#    hand (`npm publish -w blender --auth-type=web`, from a clean checkout of the tag): where npm has the tag's version
#    already, the step says so and publishes nothing. With the variable NPM_STAGE "true" (the repository's or the
#    organization's), the version is staged (`npm stage publish`) and published once a maintainer approves it with 2FA
#    on npmjs.com.
name: Blender release

on:
  push:
    tags: ["blender-v*"]
    branches: [main]
    # For the push to main only: GitHub does not look at paths for a tag.
    paths: [blender/package.json]

concurrency:
  group: blender-release
  cancel-in-progress: false

env:
  # How the package goes to npm: see 5. above.
  NPM_PUBLISH: ${{ vars.NPM_STAGE == 'true' && 'npm stage publish' || 'npm publish' }} -w blender --access public

jobs:
  # 0. above.
  gate:
    runs-on: ubuntu-24.04
    permissions:
      # To push the tag.
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag, and whether there is anything to release
        id: tag
        run: |
          VERSION=$(node -p "require('./blender/package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG=$GITHUB_REF_NAME
            [ "$TAG" = "blender-v$VERSION" ] || { echo "the tag $TAG is not blender-v$VERSION"; exit 1; }
          else
            TAG=blender-v$VERSION
            # An assignment, so that a failed ls-remote fails the step rather than reading as no tag.
            REMOTE=$(git ls-remote --tags origin "refs/tags/$TAG")
            if [ -n "$REMOTE" ]; then
              echo "$TAG exists: nothing to release"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          { echo "tag=$TAG"; echo "version=$VERSION"; echo "release=true"; } >> "$GITHUB_OUTPUT"

  blender:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      # The GitHub release.
      contents: write
      # The image, to GHCR.
      packages: write
      # npm's trusted publishing.
      id-token: write
    env:
      IMAGE: ghcr.io/prometheion/pithagoras-blender
      BLENDER_VERSION: 5.2.2
      TAG: ${{ needs.gate.outputs.tag }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Node 22 comes with npm 10: trusted publishing takes 11.5.1 or later, and `npm stage` 11.15. One version, put in
      # before anything is pushed.
      - name: npm 11
        run: npm install -g npm@11.21.0 && npm --version
      - name: Build the image
        run: docker build -f blender/server/Dockerfile --build-arg VERSION="$VERSION" -t "$IMAGE:$VERSION" blender
      - name: Smoke test
        run: ./scripts/smoke-blender.sh "$IMAGE:$VERSION"
      - name: The live view, against the agent's code
        run: ./scripts/viewport-blender.py "$IMAGE:$VERSION"
      - name: Its size
        run: docker image inspect "$IMAGE:$VERSION" --format '{{.Size}} bytes' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$VERSION"
      - name: The sources that go with the image
        run: |
          mkdir sources && cd sources
          curl -fsSLO "https://download.blender.org/source/blender-$BLENDER_VERSION.tar.xz"
          curl -fsSLO "https://download.blender.org/source/blender-$BLENDER_VERSION.tar.xz.md5sum"
          md5sum -c "blender-$BLENDER_VERSION.tar.xz.md5sum"
          ../scripts/blender-sources.sh "$BLENDER_VERSION" .
          docker run --rm --entrypoint dpkg-query "$IMAGE:$VERSION" -W -f '${Package}\t${Version}\t${Architecture}\n' > "pithagoras-blender-$VERSION-packages.txt"
          cp ../blender/NOTICE "pithagoras-blender-$VERSION-NOTICE.txt"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A re-run after a failure further down (npm) finds the release made already: it makes sure the sources are
          # attached, and goes on to the next step.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "The release $TAG exists already: nothing to make, the sources are uploaded again"
            gh release upload "$TAG" sources/* --clobber
          else
            gh release create "$TAG" --verify-tag --title "Blender $VERSION" --notes "@pithagoras/blender $VERSION: the extension (npm:@pithagoras/blender@$VERSION) and its image ($IMAGE:$VERSION). Attached: Blender's source, the sources of the copyleft libraries its official Linux build links in (listed in blender-$BLENDER_VERSION-libraries.txt), and the image's package list, as its NOTICE says." sources/*
          fi
      - run: npm ci
      - name: Publish to npm
        run: |
          NAME=$(node -p "require('./blender/package.json').name")
          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "$NAME@$VERSION is on npm already: nothing to publish"
            exit 0
          fi
          $NPM_PUBLISH
