# A release of the Inline UI extension: inline-ui-v<version>, the version in inline-ui/package.json. Merging a
# pull request that changes that version releases it, and a tag pushed by hand still does. It has no image: the
# package is all there is.
#
# 0. The gate, as Blender's and Godot's (blender-release.yml says it at length): on a tag, the tag has to be
#    inline-ui-v<the version in inline-ui/package.json>; on a push to main that changes inline-ui/package.json,
#    the tag is inline-ui-v<its version>, and where that tag is there already the run ends and releases nothing,
#    otherwise the gate puts the tag on the pushed commit and pushes it with the job's GITHUB_TOKEN (which starts no
#    run of this workflow again). One release of the extension runs at a time (the concurrency group). If a tag ruleset
#    limits who may create *-v* tags, github-actions[bot] has to be on its bypass list. If the release job fails after
#    the gate pushed the tag, "Re-run failed jobs" runs it again for that tag.
# 1. The package is built, type-checked and its unit tests run (with the browsers its card's tests drive), from the
#    tagged commit.
# 2. The GitHub release is made for the tag (where it is there already, as on a re-run after npm failed, it is left as it is
#    and the run goes on to npm).
# 3. The package, @pithagoras/inline-ui, goes to npm. npm's trusted publishing signs in with this workflow's identity
#    (`id-token: write`), with no token, and adds provenance. Only a package that is there can be given a trusted
#    publisher, so its first version is published by hand (`npm publish -w inline-ui --auth-type=web`, from a clean
#    checkout of the tag), and npmjs.com's settings of the package then name this repository and this workflow
#    (inline-ui-release.yml) as its trusted publisher: where npm has the tag's version already, the step says so and
#    publishes nothing. With the variable NPM_STAGE "true" (the repository's or the organization's), the version is
#    staged (`npm stage publish`) and published once a maintainer approves it with 2FA on npmjs.com.
name: Inline UI release

on:
  push:
    tags: ["inline-ui-v*"]
    branches: [main]
    # For the push to main only: GitHub does not look at paths for a tag.
    paths: [inline-ui/package.json]

concurrency:
  group: inline-ui-release
  cancel-in-progress: false

env:
  # How the package goes to npm: see 3. above.
  NPM_PUBLISH: ${{ vars.NPM_STAGE == 'true' && 'npm stage publish' || 'npm publish' }} -w inline-ui --access public

jobs:
  # 0. above.
  gate:
    runs-on: ubuntu-24.04
    permissions:
      # To push the tag.
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag, and whether there is anything to release
        id: tag
        run: |
          VERSION=$(node -p "require('./inline-ui/package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG=$GITHUB_REF_NAME
            [ "$TAG" = "inline-ui-v$VERSION" ] || { echo "the tag $TAG is not inline-ui-v$VERSION"; exit 1; }
          else
            TAG=inline-ui-v$VERSION
            # An assignment, so that a failed ls-remote fails the step rather than reading as no tag.
            REMOTE=$(git ls-remote --tags origin "refs/tags/$TAG")
            if [ -n "$REMOTE" ]; then
              echo "$TAG exists: nothing to release"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          { echo "tag=$TAG"; echo "version=$VERSION"; echo "release=true"; } >> "$GITHUB_OUTPUT"

  inline-ui:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      # The GitHub release.
      contents: write
      # npm's trusted publishing.
      id-token: write
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Node 22 comes with npm 10: trusted publishing takes 11.5.1 or later, and `npm stage` 11.15.
      - name: npm 11
        run: npm install -g npm@11.21.0 && npm --version
      - run: npm ci
      - name: Build and type-check
        run: npm run build -w inline-ui
      - name: The browsers the card's tests drive
        run: npx playwright install --with-deps chromium firefox
      - name: Unit and browser tests
        run: npm test -w inline-ui
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A re-run after a failure further down (npm) finds the release made already: it goes on to the next step.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "The release $TAG exists already: nothing to make"
          else
            gh release create "$TAG" --verify-tag --title "Inline UI $VERSION" --notes "@pithagoras/inline-ui $VERSION: the extension, on npm as npm:@pithagoras/inline-ui@$VERSION. It has no image."
          fi
      - name: Publish to npm
        run: |
          NAME=$(node -p "require('./inline-ui/package.json').name")
          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "$NAME@$VERSION is on npm already: nothing to publish"
            exit 0
          fi
          $NPM_PUBLISH
