# Every pull request, and main: each extension built and type-checked, its unit tests (for Inline UI, its card in
# Chromium and Firefox as well, through Playwright), and its portal-tier tests against the Pithagoras its extension API
# is of (scripts/pithagoras.sh). Until a release of Pithagoras has Docker for extensions 1.3.0 and Files 0.2.0 (its
# sources hook, which Nextcloud's portal tests need), that is the commit of its main that brought the later of them
# (PITHAGORAS_REF, thecodacus/pithagoras#367): its v0.2.0 has 1.2.0, which the extensions refuse. With that release,
# the extension API is bumped and the line goes.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and type-check
        run: npm run build
      - name: The browsers Inline UI's card is tested in
        run: npx playwright install --with-deps chromium firefox
      - name: Unit tests
        run: npm test
      - name: The servers' Python compiles
        run: python3 -m py_compile blender/server/server.py godot/server/server.py godot/server/client.py
      - name: Pithagoras, for the portal-tier tests
        run: ./scripts/pithagoras.sh
        env:
          PITHAGORAS_REF: 11f811f37506fe9d7be18c8b668c7c68a4ce35e3
      - name: Portal-tier tests
        run: npm run test:portal
        env:
          PITHAGORAS_DIR: ${{ github.workspace }}/.pithagoras
