<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blender</title>
<style>
  :root{
    --bg:#121417; --panel:#1a1e23; --panel2:#20252b; --line:#2b3138; --text:#dfe4ea; --muted:#8b95a1; --faint:#5b6470;
    --accent:#f5a623; --accent-ink:#1a1306; --ok:#4fd18b; --bad:#ff7a6b; --sel:#6cb8ff;
    --sans:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box} [hidden]{display:none!important}
  html,body{height:100%} body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 var(--sans)}
  button,select,input{font:inherit;color:inherit}
  #app{display:grid;grid-template-rows:auto 1fr;height:100%}

  header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
  header h1{font-size:15px;margin:0}
  .pill{display:flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .pill.busy{color:var(--accent);border-color:rgba(245,166,35,.45)} .pill.busy .dot{background:var(--accent);animation:pulse 1s infinite}
  .pill.off .dot{background:var(--bad)}
  @keyframes pulse{50%{opacity:.3}}
  .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  header .spacer{flex:1}
  header{flex-wrap:wrap;row-gap:8px} @media (max-width:640px){header .meta{display:none}}
  /* the server refused the request: the portal's sign-in ended, or the page was opened without the portal */
  #nc{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);text-align:center;z-index:10}

  main{display:grid;grid-template-columns:var(--lw,260px) minmax(0,1fr) var(--rw,300px);min-height:0}
  main.noleft{--lw:30px} main.noright{--rw:30px}
  aside .rail{display:none}
  aside.collapsed > *{display:none!important}
  aside.collapsed > .rail{display:flex!important;flex-direction:column;align-items:center;gap:10px;padding:10px 0;height:100%;width:100%;border:0;background:none;cursor:pointer;color:var(--muted)}
  aside.collapsed > .rail:hover{background:var(--panel2);color:var(--text)}
  .rail span{writing-mode:vertical-rl;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  .rail svg,.pbtn svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .h2r{display:flex;align-items:center;gap:8px}
  .pbtn{width:20px;height:20px;border-radius:5px;border:1px solid transparent;background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted);padding:0}
  .pbtn:hover{background:var(--panel2);border-color:var(--line);color:var(--text)}
  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  aside.right{border-right:0;border-left:1px solid var(--line)}
  .sect{padding:12px 14px;border-bottom:1px solid var(--line)}
  .sect h2{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
  .sect h2 b{color:var(--faint);font-weight:500}
  .help{color:var(--muted);font-size:12px;margin:6px 0 0}
  .scroll{overflow:auto;min-height:0;flex:1}

  #objFilter{width:100%;background:#111418;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px}
  #objFilter:focus{outline:none;border-color:var(--accent)}
  #outliner{list-style:none;margin:0;padding:4px 6px 8px}
  #outliner li{display:flex;gap:6px;align-items:center;height:26px;padding-right:8px;border-radius:5px;cursor:pointer;white-space:nowrap}
  #outliner li:hover{background:var(--panel2)} #outliner li.sel{background:rgba(108,184,255,.16);color:#cfe7ff}
  #outliner li.off .nm{color:var(--faint)} #outliner li.coll .nm{font-weight:600}
  #outliner .tw{width:14px;height:14px;flex:none;display:grid;place-items:center;color:var(--muted);border-radius:3px}
  #outliner .tw svg{width:8px;height:8px;fill:currentColor;transition:transform .12s}
  #outliner .tw.open svg{transform:rotate(90deg)} #outliner .tw:hover{color:var(--text);background:rgba(255,255,255,.08)}
  #outliner .ic{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;color:#e8963c}
  #outliner .ic.COLLECTION{color:#dfe4ea} #outliner .ic.CAMERA{color:#9aa4b0} #outliner .ic.LIGHT{color:#f2d15c}
  #outliner .ic.ARMATURE{color:#7fd08a} #outliner .ic.EMPTY{color:#9aa4b0}
  #outliner .nm{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  #outliner .ct{font-family:var(--mono);font-size:10px;color:var(--faint)}
  #outliner .none{color:var(--faint);cursor:default;padding-left:10px}
  #objinfo{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:pre-wrap}

  .center{display:grid;grid-template-rows:auto 1fr auto auto;grid-template-columns:minmax(0,1fr);min-height:0;min-width:0;background:#0d0f12}
  .tabs{display:flex;align-items:end;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
  .tab{padding:7px 12px;border:1px solid transparent;border-bottom:0;border-radius:7px 7px 0 0;background:none;color:var(--muted);cursor:pointer}
  .tab[aria-selected=true]{background:var(--panel);border-color:var(--line);color:var(--text)}
  .tab:focus-visible{outline:2px solid var(--sel)}
  .stage{position:relative;min-height:0;overflow:hidden}
  .stage > div{position:absolute;inset:0}
  #live,#prevImg,#lastImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0d0f12;user-select:none;-webkit-user-drag:none}
  #liveWrap{cursor:grab} #liveWrap.dragging{cursor:grabbing}
  /* viewport header, Blender style: shading buttons, then the navigation gizmo and its round buttons */
  .shading{position:absolute;top:10px;right:10px;display:flex;background:rgba(26,30,35,.92);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .shading button{border:0;background:none;width:30px;height:26px;display:grid;place-items:center;cursor:pointer;color:#b9c1cb}
  .shading button + button{border-left:1px solid var(--line)}
  .shading button:hover{background:var(--panel2)}
  .shading button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
  .shading svg{width:16px;height:16px;display:block}
  .nav{position:absolute;top:46px;right:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
  #gizmo{width:92px;height:92px;border-radius:50%;cursor:grab;touch-action:none;user-select:none}
  #gizmo:hover,#gizmo.dragging{background:rgba(255,255,255,.1)} #gizmo.dragging{cursor:grabbing}
  #gizmo [data-axis]{cursor:pointer} #gizmo [data-axis]:hover{filter:brightness(1.3)}
  #gizmo text{font:700 10px var(--sans);text-anchor:middle;dominant-baseline:central;pointer-events:none;fill:#101215}
  .navbtns{display:flex;flex-direction:column;gap:5px;align-self:flex-end;margin-right:2px}
  .navbtns button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:rgba(26,30,35,.92);display:grid;place-items:center;cursor:pointer;color:#b9c1cb;padding:0}
  .navbtns button:hover{background:var(--panel2);color:var(--text)}
  .navbtns svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .shading button:focus-visible,.navbtns button:focus-visible{outline:2px solid var(--sel);outline-offset:-2px}
  .hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(26,30,35,.92);border:1px solid var(--line);border-radius:999px;padding:5px 14px;color:var(--muted);font-size:12px;white-space:nowrap}
  .hint kbd{font-family:var(--mono);font-size:11px;color:var(--text)}
  .badge{position:absolute;bottom:10px;right:10px;font-family:var(--mono);font-size:11px;color:var(--muted);background:rgba(26,30,35,.92);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
  .badge.working{color:var(--accent)}
  /* Blender is busy with something that holds its frames back (the agent's script, a render): said over the view, so
     that the picture under it reads as the one from before, not as the scene now */
  .busy-note{position:absolute;top:10px;left:10px;max-width:calc(100% - 140px);display:flex;flex-direction:column;gap:2px;background:rgba(26,30,35,.92);border:1px solid rgba(245,166,35,.45);border-radius:8px;padding:6px 10px;color:var(--accent);font-size:12px;pointer-events:none}
  .busy-note b{display:flex;align-items:center;gap:7px;font-weight:600} .busy-note b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
  .busy-note span{color:var(--muted);font-size:11.5px}
  .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);pointer-events:none}
  .foot{display:flex;gap:16px;padding:6px 12px;border-top:1px solid var(--line);color:var(--faint);font-family:var(--mono);font-size:11px}

  .row{display:grid;grid-template-columns:80px 1fr;align-items:center;gap:8px;margin-bottom:8px}
  .row label{color:var(--muted);font-size:12px}
  select,input[type=number]{width:100%;background:#111418;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
  select:focus,input:focus{outline:none;border-color:var(--accent)}
  .btn{width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;margin-top:6px;text-align:left}
  .btn b{display:block;font-weight:600} .btn span{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .btn.primary span{color:rgba(26,19,6,.75)}
  .btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.5;cursor:default;filter:none}
  .btn:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
  #gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #gallery figure{margin:0;cursor:pointer} #gallery img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:5px;border:1px solid var(--line);background:#000}
  #gallery figcaption{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #log{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:pre-wrap;max-height:180px;overflow:auto;margin:0}
  .toast{position:fixed;bottom:18px;right:18px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:8px;padding:10px 14px;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:6}
  .toast.err{border-left-color:var(--bad)}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;cursor:zoom-out;z-index:5}
  .lightbox img{max-width:94vw;max-height:90vh;border-radius:6px}
  /* narrower side panels in a narrow window; folded ones stay folded (main.noleft / main.noright win) */
  @media (max-width:1100px){main{--lw:200px;--rw:260px}}
  /* a panel beside a chat: the mouse hint would sit under the frame badge, and the timeline keeps its frame numbers */
  @media (max-width:720px){.hint{display:none} #tlTime{display:none}}
  /* timeline */
  .timeline{display:flex;align-items:center;gap:10px;padding:6px 10px;border-top:1px solid var(--line);background:var(--panel)}
  .tlbtns{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
  .tlbtns button{border:0;background:var(--panel2);width:30px;height:28px;display:grid;place-items:center;cursor:pointer;color:var(--text)}
  .tlbtns button + button{border-left:1px solid var(--line)}
  .tlbtns button:hover{background:#2a3038} .tlbtns button:focus-visible{outline:2px solid var(--sel);outline-offset:-2px}
  .tlbtns button.play{width:40px;background:var(--accent);color:var(--accent-ink)}
  .tlbtns svg{width:12px;height:12px;fill:currentColor}
  .tlact{display:flex;align-items:center;gap:6px;flex:none;color:var(--muted);font-size:12px}
  .tlact select{width:auto;max-width:170px;padding:5px 8px;font-size:12px}
  #tlCanvas{flex:1 1 0;width:0;min-width:0;height:36px;cursor:ew-resize;touch-action:none;border-radius:6px}
  .tlinfo{display:flex;align-items:center;gap:6px;flex:none;font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
  .tlinfo input{width:58px;background:#111418;border:1px solid var(--line);border-radius:6px;padding:4px 6px;text-align:right;font-family:var(--mono);font-size:12px}
  /* workspace menu */
  .ws{position:relative}
  .wsbtn{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 12px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);cursor:pointer;max-width:320px}
  .wsbtn:hover,.wsbtn[aria-expanded=true]{border-color:var(--accent)}
  .wsbtn .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wsbtn .unsaved{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
  .wsbtn .car{color:var(--muted);font-size:10px}
  .wsmenu{position:absolute;top:calc(100% + 6px);left:0;width:440px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.5);z-index:4;display:flex;flex-direction:column;max-height:min(640px,calc(100vh - 80px))}
  .wsacts{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-bottom:1px solid var(--line)}
  .wsacts button{padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
  .wsacts button:hover{border-color:var(--accent)} .wsacts button:disabled{opacity:.45;cursor:default;border-color:var(--line)}
  .wsform{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .wsform p{margin:0;color:var(--text)} .wsform .sub{color:var(--muted);font-size:12px}
  .wsform input[type=text]{width:100%;background:#111418;border:1px solid var(--line);border-radius:6px;padding:7px 9px}
  .wsform .btns{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
  .wsform .btns button{padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
  .wsform .btns button.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .wsform .btns button.danger{color:var(--bad)}
  .wslist{list-style:none;margin:0;padding:6px;overflow:auto}
  .wslist li{display:flex;gap:10px;align-items:center;padding:6px;border-radius:7px;cursor:pointer}
  .wslist li:hover{background:var(--panel2)} .wslist li.cur{background:rgba(245,166,35,.1)}
  .wslist .th{width:96px;aspect-ratio:16/9;border-radius:5px;border:1px solid var(--line);background:#0c0e10 center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--faint);font-size:10px}
  .wslist .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wslist .info{min-width:0;flex:1} .wslist .sub{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .wslist .tag{font-size:10.5px;color:var(--accent);margin-left:6px;font-weight:400}
  .wsempty{padding:16px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="mark">B</div><h1>Blender</h1>
    <div class="ws">
      <button class="wsbtn" id="wsBtn" aria-expanded="false" data-t-title="projects"><span class="nm" id="wsName"></span><span class="unsaved" id="wsDirty" hidden data-t-title="unsaved"></span><span class="car">▼</span></button>
      <div class="wsmenu" id="wsMenu" hidden>
        <div class="wsacts">
          <button id="wsNew" data-t="ws.new"></button><button id="wsSave" data-t="ws.save"></button><button id="wsSaveAs" data-t="ws.saveAs"></button>
          <button id="wsUpload" data-t="ws.upload"></button><button id="wsDownload" data-t="ws.download"></button>
          <input type="file" id="wsFile" accept=".blend" hidden>
        </div>
        <div class="wsform" id="wsForm" hidden></div>
        <ul class="wslist" id="wsList"></ul>
      </div>
    </div>
    <div class="pill" id="pill"><span class="dot"></span><span id="pilltext" data-t="connecting"></span></div>
    <span class="meta" id="meta"></span>
    <span class="spacer"></span>
  </header>

  <main>
    <aside id="panelL">
      <button class="rail" id="showL" data-t-title="showL.title" data-t-aria="showL"><svg viewBox="0 0 12 12"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg><span data-t="scene"></span></button>
      <div class="sect"><h2><span data-t="scene"></span> <span class="h2r"><b id="objcount"></b><button class="pbtn" id="hideL" data-t-title="hideL.title" data-t-aria="hideL"><svg viewBox="0 0 12 12"><path d="M7.5 2.5 4 6l3.5 3.5"/></svg></button></span></h2>
        <input id="objFilter" type="search" data-t-placeholder="filter" data-t-aria="filter" autocomplete="off"></div>
      <div class="scroll"><ul id="outliner"></ul></div>
      <div class="sect"><h2 data-t="selected"></h2><div id="objinfo" data-t="nothingSelected"></div></div>
    </aside>

    <section class="center">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" data-tab="live"><span data-t="tab.live"></span> <span class="meta" data-t="tab.liveBy"></span></button>
        <button class="tab" role="tab" aria-selected="false" data-tab="prev" data-t="tab.camera"></button>
        <button class="tab" role="tab" aria-selected="false" data-tab="last" data-t="tab.last"></button>
      </div>
      <div class="stage">
        <div data-pane="live" id="liveWrap">
          <img id="live" data-t-alt="live.alt">
          <div class="empty" id="emptyLive" data-t="live.waiting"></div>
          <div class="shading" role="group" data-t-aria="shading">
            <button data-shade="SOLID" aria-pressed="true" data-t-aria="solid" data-t-title="solid.title">
              <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="currentColor"/></svg></button>
            <button data-shade="MATERIAL" aria-pressed="false" data-t-aria="material" data-t-title="material.title">
              <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.4" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 8V2.6A5.4 5.4 0 0 1 13.4 8zM8 8v5.4A5.4 5.4 0 0 1 2.6 8z" fill="currentColor"/></svg></button>
            <button data-shade="RENDERED" aria-pressed="false" data-t-aria="rendered" data-t-title="rendered.title">
              <svg viewBox="0 0 16 16"><defs><radialGradient id="shadeBall" cx="35%" cy="32%" r="75%"><stop offset="0" stop-color="currentColor" stop-opacity="1"/><stop offset="1" stop-color="currentColor" stop-opacity=".18"/></radialGradient></defs><circle cx="8" cy="8" r="6" fill="url(#shadeBall)"/><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
          </div>
          <div class="nav">
            <svg id="gizmo" viewBox="0 0 92 92" role="group" data-t-aria="gizmo"></svg>
            <div class="navbtns">
              <button id="fit" data-t-title="fit" data-t-aria="fit"><svg viewBox="0 0 14 14"><path d="M1.5 4.5v-3h3M9.5 1.5h3v3M12.5 9.5v3h-3M4.5 12.5h-3v-3"/><rect x="4.6" y="4.6" width="4.8" height="4.8" rx=".8"/></svg></button>
              <button id="zin" data-t-title="zoomIn" data-t-aria="zoomIn"><svg viewBox="0 0 14 14"><circle cx="6" cy="6" r="4.2"/><path d="M9.2 9.2l3.3 3.3M4.2 6h3.6M6 4.2v3.6"/></svg></button>
              <button id="zout" data-t-title="zoomOut" data-t-aria="zoomOut"><svg viewBox="0 0 14 14"><circle cx="6" cy="6" r="4.2"/><path d="M9.2 9.2l3.3 3.3M4.2 6h3.6"/></svg></button>
            </div>
          </div>
          <div class="hint" data-t-html="hint"></div>
          <div class="badge" id="badge">—</div>
          <div class="busy-note" id="busyNote" hidden><b id="busyWhat"></b><span data-t="live.busyHint"></span></div>
        </div>
        <div data-pane="prev" hidden><img id="prevImg" data-t-alt="prev.alt"><div class="empty" id="emptyPrev" data-t="prev.none"></div></div>
        <div data-pane="last" hidden><img id="lastImg" data-t-alt="last.alt"><div class="empty" id="emptyLast" data-t="last.none"></div></div>
      </div>
      <div class="timeline" id="timeline">
        <div class="tlbtns">
          <button id="tlStart" data-t-title="tl.first.title" data-t-aria="tl.first"><svg viewBox="0 0 12 12"><rect x="1" y="1.5" width="2" height="9"/><path d="M11 1.5v9L4 6z"/></svg></button>

  }
  const walk = (key, depth) => (kids.get(key) || []).map(n => {
    const has = kids.has(n.key), open = has && !closedNodes.has(n.key);
    return row(n, depth, `<span class="tw${open ? ' open' : ''}"${has ? ' data-toggle' : ''}>${has ? '<svg viewBox="0 0 8 8"><path d="M2 .8 6.4 4 2 7.2z"/></svg>' : ''}</span>`) + (open ? walk(n.key, depth + 1) : '');
  }).join('');
  return walk('root', 0) || `<li class="none">${esc(tr('out.empty'))}</li>`;
}
function drawOutliner() {
  const html = treeHtml(lastState.scene || {}, $('objFilter').value.trim().toLowerCase());
  if ($('outliner').dataset.html !== html) { $('outliner').innerHTML = html; $('outliner').dataset.html = html; }
}
$('objFilter').oninput = drawOutliner;
$('outliner').onclick = e => {
  const li = e.target.closest('li[data-key]'); if (!li) return;
  if (e.target.closest('[data-toggle]') || !li.dataset.name) {   // the arrow, or anywhere on a collection row
    closedNodes.has(li.dataset.key) ? closedNodes.delete(li.dataset.key) : closedNodes.add(li.dataset.key);
    try { localStorage.setItem('bs_closed', JSON.stringify([...closedNodes].slice(-300))); } catch (e) {}
    drawOutliner();
  } else select(li.dataset.name);
};
let selected = null;
function select(name) {
  selected = name;
  document.querySelectorAll('#outliner li').forEach(li => li.classList.toggle('sel', li.dataset.name === name));
  const o = (lastState.scene.objects || []).find(x => x.name === name);
  const line = (key, value) => `\n${tr(key).padEnd(10)}${value}`;
  $('objinfo').textContent = o ? o.name + line('obj.type', o.type) + line('obj.location', o.location.map(v => v.toFixed(2)).join(', ')) +
    (o.parent ? line('obj.parent', o.parent) : '') + (o.collection ? line('obj.in', o.collection) : '') : tr('nothingSelected');
  if (o && o.type !== 'CAMERA' && o.type !== 'LIGHT') frameBox(o.center, o.size);
}

// ---------- tabs ----------
document.querySelectorAll('.tab').forEach(t => t.onclick = () => showTab(t.dataset.tab));
function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === name));
  document.querySelectorAll('[data-pane]').forEach(p => p.hidden = p.dataset.pane !== name);
  $('timeline').hidden = name !== 'live'; if (name !== 'live' && anim.playing) play(false);
  if (name === 'live') drawTimeline();
}

// ---------- render panel ----------
function view() {
  return { coords: 'blender', position: camPos(), target: cam.target.slice(), fov: cam.fov, aspect: aspect(), frame: anim.frame, actions: anim.pick,
           engine: $('engine').value, samples: +$('samples').value, width: +$('width').value };
}
async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (r.status === 401) { notConnected(); return {}; }
  return r.json();
}
function toast(msg, bad) {
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 5000);
}
function setBusy(b) { $('renderView').disabled = b; $('setCam').disabled = b; }
$('renderView').onclick = async () => {
  setBusy(true); toast(tr('toast.rendering'));
  try {
    const r = await post('api/render_view', view());
    if (r.error) toast(tr('toast.renderFailed', { error: r.error }), true);
    else if (r.result) { toast(tr('toast.rendered', { frame: r.result.frame, s: r.result.seconds, how: r.result.engine === 'CYCLES' ? tr('toast.cyclesOn', { device: r.result.device }) : 'EEVEE' })); showTab('last'); }
  } finally { setBusy(false); }
};
$('setCam').onclick = async () => {
  setBusy(true);
  try {
    const r = await post('api/set_camera', view());
    if (r.error) toast(tr('toast.camFailed', { error: r.error }), true);
    else if (r.result) toast(tr('toast.camMoved', { camera: r.result.camera }));
  } finally { setBusy(false); }
};

// ---------- server state: status, outliner, edits ----------
let lastState = { scene: {} }, lastPreview = 0, lastRender = '', framed = false;
function ago(t) { const s = Math.round(Date.now() / 1000 - t); return s < 60 ? tr('ago.s', { n: s }) : tr('ago.min', { n: Math.round(s / 60) }); }
async function poll() {
  try {
    if (!connected) return;
    const resp = await fetch('api/state');
    if (resp.status === 401) { notConnected(); return; }
    const s = await resp.json(); lastState = s; showProject(s.project); syncAnim(s.scene && s.scene.anim, s.scene_at);
    const doing = s.busy && (TEXTS[LANG]['busy.' + s.busy] ?? String(s.busy).replaceAll('_', ' '));
    $('pill').className = 'pill' + (s.busy ? ' busy' : '');
    $('pilltext').textContent = s.busy ? tr('working', { what: doing }) : tr('idle');
    // Busy for more than a moment: the frames wait for it, so the view says so rather than look current.
    const busyFor = s.busy && s.busy_at ? Math.round(s.now - s.busy_at) : 0;
    $('busyNote').hidden = busyFor < 1;
    if (busyFor >= 1) $('busyWhat').textContent = tr('live.busy', { what: doing, s: busyFor });
    $('meta').textContent = `Blender ${s.blender} · ${s.gpu}`;
    if (!framed && s.scene && s.scene.bounds) { framed = true; frameBox(s.scene.bounds.center, s.scene.bounds.size); }
    // an edit re-rendered the viewport on the server, or a long script asked for a frame between its steps: show it,
    // also while a frame of the page's own waits for Blender behind that work
    if (s.viewport_at && s.viewport_at > lastSeenViewport && !drag && !anim.playing) {
      lastSeenViewport = s.viewport_at;
      show('files/viewport/live.jpg?t=' + s.viewport_at, true);
      $('badge').textContent = tr('badge.edited', { ms: s.viewport_ms });
    }
    const objs = (s.scene && s.scene.objects) || [];
    $('objcount').textContent = objs.length;
    drawOutliner();
    $('sceneAge').textContent = s.scene_at ? tr('changed', { ago: ago(s.scene_at) }) : '';
    if (s.preview_at && s.preview_at !== lastPreview) { lastPreview = s.preview_at; $('prevImg').src = 'files/previews/latest.png?t=' + s.preview_at; $('emptyPrev').hidden = true; }
    if (s.renders.length && s.renders[0].rel !== lastRender) { lastRender = s.renders[0].rel; $('lastImg').src = fileUrl(lastRender); $('emptyLast').hidden = true; }
    $('rcount').textContent = s.renders.length || '';
    const g = s.renders.map(r => `<figure data-src="${esc(fileUrl(r.rel))}"><img loading="lazy" src="${esc(fileUrl(r.rel))}" alt=""><figcaption>${esc(String(r.rel).split('/').pop())} · ${esc(r.seconds)}s</figcaption></figure>`).join('');
    if ($('gallery').dataset.html !== g) { $('gallery').innerHTML = g; $('gallery').dataset.html = g;
      $('gallery').querySelectorAll('figure').forEach(f => f.onclick = () => { const lb = document.createElement('div'); lb.className = 'lightbox'; const big = document.createElement('img'); big.src = f.dataset.src; big.alt = ''; lb.appendChild(big); lb.onclick = () => lb.remove(); document.body.appendChild(lb); }); }
    $('log').textContent = s.log.join('\n');
  } catch (e) {
    // No state (Blender is not answering): what it said it was busy with is not current either.
    $('pill').className = 'pill off'; $('pilltext').textContent = tr('disconnected'); $('busyNote').hidden = true;
  }
}
setInterval(poll, 1000); poll();

// ---------- workspace: switch, create, save, upload, download projects ----------
let project = { path: null, name: 'untitled', dirty: false }, wsBusy = false;
function showProject(p) {
  if (!p) return;
  if (p.path !== project.path) { framed = false; selected = null; anim.ready = false; anim.pick = {}; anim.target = null; if (anim.playing) play(false); }   // a different project: frame its contents, start on its frame
  project = p;
  $('wsName').textContent = p.path ? p.name : tr('untitled'); $('wsDirty').hidden = !p.dirty;
  $('wsSave').disabled = !p.path; $('wsDownload').disabled = !p.path;
}

function openMenu(open) {
  $('wsMenu').hidden = !open; $('wsBtn').setAttribute('aria-expanded', open);
  if (open) { closeForm(); loadProjects(); }
}
$('wsBtn').onclick = e => { e.stopPropagation(); openMenu($('wsMenu').hidden); };
document.addEventListener('click', e => { if (!$('wsMenu').hidden && !e.target.closest('.ws')) openMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('wsMenu').hidden) openMenu(false); });

function size(b) { return b > 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB'; }
async function loadProjects() {
  const r = await fetch('api/projects'); if (r.status === 401) { notConnected(); return; }
  const list = (await r.json()).projects;
  $('wsList').innerHTML = list.length ? list.map(p => `<li data-path="${esc(p.path)}" class="${p.path === project.path ? 'cur' : ''}">
      <span class="th" style="${p.thumb ? esc(`background-image:url('${fileUrl(p.thumb)}?t=${Number(p.modified)}')`) : ''}">${p.thumb ? '' : esc(tr('ws.noPreview'))}</span>
      <span class="info"><div class="nm">${esc(p.name)}${p.path === project.path ? `<span class="tag">${esc(tr('ws.open'))}</span>` : ''}</div>
      <div class="sub">${esc(p.path.replace(/^scenes\//, ''))} · ${size(p.bytes)} · ${esc(ago(p.modified))}</div></span></li>`).join('')
    : `<div class="wsempty">${esc(tr('ws.none'))}</div>`;
  $('wsList').querySelectorAll('li').forEach(li => li.onclick = () => {
    if (wsBusy || li.dataset.path === project.path) return;
    guard(tr('ws.openQ', { name: li.querySelector('.nm').firstChild.textContent }), () => act({ action: 'open', path: li.dataset.path }, 'ws.opened'));
  });
}

function closeForm() { $('wsForm').hidden = true; $('wsForm').innerHTML = ''; }
function form(html, wire) { $('wsForm').innerHTML = html; $('wsForm').hidden = false; wire($('wsForm')); }

// unsaved work: ask before replacing it
function guard(what, go) {
  if (!project.dirty) return go();
  form(`<p>${esc(what)}?</p><div class="sub">${esc(project.path ? tr('ws.unsavedIn', { name: project.name }) : tr('ws.neverSaved'))}</div>
    <div class="btns"><button data-b="cancel">${esc(tr('cancel'))}</button><button data-b="discard" class="danger">${esc(tr('discard'))}</button>
    ${project.path ? `<button data-b="save" class="go">${esc(tr('saveContinue'))}</button>` : ''}</div>`, f => {
    f.querySelector('[data-b=cancel]').onclick = closeForm;
    f.querySelector('[data-b=discard]').onclick = () => { closeForm(); go(); };
    const sv = f.querySelector('[data-b=save]');
    if (sv) sv.onclick = async () => { closeForm(); if (await act({ action: 'save' }, 'ws.saved', true)) go(); };
  });
}

async function act(body, done, keepOpen) {
  wsBusy = true; document.querySelectorAll('.wsacts button').forEach(b => b.disabled = true);
  try {
    const r = await post('api/project', body);
    if (r.error) { toast(r.error, true); return false; }
    await poll(); toast(tr(done, { name: project.name }));
    if (!keepOpen) openMenu(false); else loadProjects();
    if (body.action === 'open' || body.action === 'new') requestFrame('full');
    return true;
  } finally { wsBusy = false; document.querySelectorAll('.wsacts button').forEach(b => b.disabled = false); showProject(project); }
}

function nameForm(title, label, go, extra, submit) {
  form(`<p>${esc(title)}</p><input type="text" id="wsNameIn" placeholder="${esc(label)}" maxlength="80" autocomplete="off">${extra}
    <div class="btns"><button data-b="cancel">${esc(tr('cancel'))}</button><button data-b="ok" class="go">${esc(go)}</button></div>`, f => {
    const inp = f.querySelector('#wsNameIn'); inp.focus();
    const ok = () => { const v = inp.value.trim(); if (!v) { inp.focus(); return; } submit(v, f); };
    f.querySelector('[data-b=ok]').onclick = ok; inp.onkeydown = e => { if (e.key === 'Enter') ok(); };
    f.querySelector('[data-b=cancel]').onclick = closeForm;
  });
}
$('wsNew').onclick = () => guard(tr('ws.newQ'), () => nameForm(tr('ws.create'), tr('ws.name'), tr('ws.createGo'),
  `<label class="sub"><input type="checkbox" id="wsTpl"> ${esc(tr('ws.template'))}</label>`,
  (name, f) => act({ action: 'new', name, template: f.querySelector('#wsTpl').checked ? 'default' : 'empty' }, 'ws.created')));
$('wsSave').onclick = () => act({ action: 'save' }, 'ws.saved', true);
$('wsSaveAs').onclick = () => nameForm(tr('ws.saveAsTitle'), tr('ws.newName'), tr('ws.saveAsGo'), '',
  name => act({ action: 'save_as', name }, 'ws.saved', true));
$('wsDownload').onclick = () => { if (project.path) location.href = fileUrl(project.path); };
$('wsUpload').onclick = () => $('wsFile').click();
$('wsFile').onchange = async () => {
  const file = $('wsFile').files[0]; $('wsFile').value = ''; if (!file) return;
  const name = file.name.replace(/\.blend$/i, '');
  toast(tr('ws.uploading', { name: file.name, size: size(file.size) }));
  const r = await fetch('api/project/upload?name=' + encodeURIComponent(name), { method: 'POST', body: file });
  if (r.status === 401) { notConnected(); return; }
  const j = await r.json();
  if (j.error) { toast(tr('ws.uploadFailed', { error: j.error }), true); return; }
  await loadProjects();
  guard(tr('ws.openUploaded', { name }), () => act({ action: 'open', path: j.result.path }, 'ws.opened'));
};
</script>
</body>
